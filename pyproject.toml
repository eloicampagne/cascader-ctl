[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cascader-ctl"
version = "0.1.0"
description = "Cascaded Transfer Learning: many tasks under a global refinement budget"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Eloi Campagne", email = "eloi.campagne@gmail.com" },
    { name = "Yvenn Amara-Ouali" },
    { name = "Yannig Goude" },
    { name = "Mathilde Mougeot" },
    { name = "Argyris Kalogeratos" },
]
keywords = ["transfer-learning", "multi-task", "budget", "spanning-tree", "cascade"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "torch>=2.0",
]

[project.optional-dependencies]
images = ["scikit-learn>=1.3"]
tuning = ["optuna>=3.4"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/eloicampagne/cascader-ctl"
Source = "https://github.com/eloicampagne/cascader-ctl"
Issues = "https://github.com/eloicampagne/cascader-ctl/issues"

[project.scripts]
cascader = "cascader.experiments.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cascader"]

[tool.hatch.build.targets.sdist]
include = ["src/cascader", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-scale reproductions (deselect with '-m \"not slow\"')",
    "needs_data: requires a dataset that is not bundled (CASCADER_DATA_DIR)",
]

[tool.ruff]
line-length = 90
target-version = "py310"
